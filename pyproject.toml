[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "doc-dl"
version = "0.1.4"
description = "A reliable command-line downloader for documents on modern websites"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "doc-dl contributors" }
]
keywords = ["documents", "downloader", "pdf", "playwright", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Utilities"
]
dependencies = [
  "httpx>=0.27,<1",
  "Pillow>=11,<13",
  "playwright>=1.49,<2",
  "pypdf>=5,<7"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9"
]
build = [
  "pyinstaller>=6.11,<8"
]

[project.scripts]
doc-dl = "doc_dl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_dl"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "browser: requires the Playwright Chromium runtime"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
