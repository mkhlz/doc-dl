<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Slide deck that cites an external paper</title>
  </head>
  <body>
    <h1>A slide deck</h1>
    <p>
      The deck itself is rebuilt from its page images. The link below is a work
      cited on the references slide, hosted on another site, and must never be
      mistaken for the deck being requested.
    </p>
    <ul>
      <li>
        <a href="https://third-party.example/papers/cited-work.pdf">
          Cited paper (a different document entirely)
        </a>
      </li>
    </ul>
  </body>
</html>
