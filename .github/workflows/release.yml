name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 0.1.3. Leave empty for a build-only run.
        required: false
        default: ""
        type: string
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Resolve and verify version
        id: release
        shell: python
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          import os
          import re
          import tomllib
          from pathlib import Path

          metadata = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          package_version = metadata["project"]["version"]
          source = (Path("src") / "doc_dl" / "__init__.py").read_text(encoding="utf-8")
          match = re.search(r'^__version__\s*=\s*["\']([^"\']+)["\']', source, re.MULTILINE)
          if not match:
              raise SystemExit("Could not read __version__ from src/doc_dl/__init__.py")
          source_version = match.group(1)
          if source_version != package_version:
              raise SystemExit(
                  f"Version mismatch: pyproject.toml={package_version}, "
                  f"src/doc_dl/__init__.py={source_version}"
              )

          event_name = os.environ["EVENT_NAME"]
          requested = os.environ.get("INPUT_VERSION", "").strip()
          if event_name == "push":
              requested = os.environ["REF_NAME"]
              publish = True
          else:
              publish = bool(requested)

          if requested:
              if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:[.-][0-9A-Za-z.-]+)?", requested):
                  raise SystemExit(
                      f"Invalid release version {requested!r}; use a bare version such as 0.1.3"
                  )
              if requested != package_version:
                  raise SystemExit(
                      f"Release version {requested} does not match package version {package_version}"
                  )

          version = requested or package_version
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as stream:
              stream.write(f"publish={'true' if publish else 'false'}\n")
              stream.write(f"tag={version}\n")
              stream.write(f"version={version}\n")
          print(f"Version: {version}")
          print(f"Publish: {publish}")

  test:
    name: Test
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          python -m playwright install --with-deps --no-shell chromium
      - name: Run checks
        run: |
          python -m ruff check src tests scripts
          python -m ruff format --check src tests scripts
          python -m pytest

  build:
    name: Build ${{ matrix.target }} (${{ matrix.variant }})
    needs: [prepare, test]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-latest
            variant: slim
            artifact: build-bin-windows_x64-slim
            asset: doc-dl_win.zip
          - target: windows-x64
            runner: windows-latest
            variant: full
            artifact: build-bin-windows_x64-full
            asset: doc-dl_win_full.zip
            playwright: install --no-shell chromium
          - target: linux-x64
            runner: ubuntu-24.04
            variant: slim
            artifact: build-bin-linux_x86_64-slim
            asset: doc-dl_linux.tar.gz
          - target: linux-x64
            runner: ubuntu-24.04
            variant: full
            artifact: build-bin-linux_x86_64-full
            asset: doc-dl_linux_full.tar.gz
            playwright: install --with-deps --no-shell chromium
          - target: macos-x64
            runner: macos-15-intel
            variant: slim
            artifact: build-bin-macos_x86_64-slim
            asset: doc-dl_macos_x64.tar.gz
          - target: macos-x64
            runner: macos-15-intel
            variant: full
            artifact: build-bin-macos_x86_64-full
            asset: doc-dl_macos_x64_full.tar.gz
            playwright: install --no-shell chromium
          - target: macos-arm64
            runner: macos-15
            variant: slim
            artifact: build-bin-macos_arm64-slim
            asset: doc-dl_macos_arm64.tar.gz
          - target: macos-arm64
            runner: macos-15
            variant: full
            artifact: build-bin-macos_arm64-full
            asset: doc-dl_macos_arm64_full.tar.gz
            playwright: install --no-shell chromium
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/build/playwright-browsers
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[build]"
      - name: Install portable Chromium
        if: matrix.variant == 'full'
        run: python -m playwright ${{ matrix.playwright }}
      - name: Build and verify bundle
        run: python scripts/build_portable.py --target ${{ matrix.target }} --variant ${{ matrix.variant }}
      - name: Upload platform archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: release-assets/${{ matrix.asset }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  collect:
    name: Collect release assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Download platform archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: build-bin-*
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        run: python scripts/write_checksums.py release-assets
      - name: Upload complete release set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs: [prepare, collect]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Download complete release set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: release-assets
      - name: Create and push release tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag ${RELEASE_TAG} already exists" >&2
            exit 1
          fi
          git tag "${RELEASE_TAG}" "${GITHUB_SHA}"
          git push origin "${RELEASE_TAG}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${RELEASE_TAG}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --notes "#### A description of the release files is in the [README](https://github.com/${GITHUB_REPOSITORY}#release-files)." \
            --title "doc-dl ${RELEASE_VERSION}"
